<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Request a demo — Fresh Air</title>
<meta name="description" content="Request early access or a demo of Fresh Air." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #0D1226;
    --panel: #141A33;
    --panel-line: #262F52;
    --ink: #EDEFF8;
    --ink-dim: #9CA4C4;
    --accent: #F5A65B;
    --accent-ink: #2A1D0E;
    --dawn-1: #1E2A4A;
    --dawn-2: #35406B;
    --dawn-3: #8A5D7E;
    --dawn-4: #E08B5C;
    --dawn-5: #F5A65B;
    --serif: "Fraunces", Georgia, serif;
    --sans: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--dawn-1) 0%, var(--dawn-2) 34%, var(--dawn-3) 62%, var(--dawn-4) 86%, var(--dawn-5) 100%);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; }

  nav.top {
    padding: 22px 28px;
  }
  .wordmark {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: -0.01em;
    text-decoration: none;
    color: #fff;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px 64px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(13,18,38,0.55);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 22px;
    padding: 40px 34px;
    backdrop-filter: blur(10px);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 28px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
    color: #fff;
  }
  p.lede {
    font-size: 14.5px;
    line-height: 1.6;
    color: rgba(255,255,255,0.75);
    margin: 0 0 30px;
  }

  .field {
    margin-bottom: 16px;
  }
  .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    margin-bottom: 7px;
  }
  input[type="text"], input[type="email"] {
    width: 100%;
    font-family: var(--sans);
    font-size: 15px;
    color: #fff;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 12px;
    padding: 12px 14px;
  }
  input::placeholder { color: rgba(255,255,255,0.35); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* honeypot — invisible to real visitors, catches basic bots */
  .hp {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }

  button.submit {
    width: 100%;
    margin-top: 8px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 15px;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 14px;
    cursor: pointer;
  }
  button.submit:disabled { opacity: 0.6; cursor: default; }
  button.submit:active:not(:disabled) { transform: translateY(1px); }

  .error {
    font-size: 13px;
    color: #FFD9C2;
    margin: 0 0 14px;
    display: none;
  }
  .error.show { display: block; }

  .back {
    display: inline-block;
    margin-top: 22px;
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    text-decoration: none;
  }

  /* success state */
  .success { display: none; text-align: center; }
  .success.show { display: block; }
  .success .check {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(245,166,91,0.16);
    border: 1px solid rgba(245,166,91,0.4);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .form-state { display: block; }
  .form-state.hide { display: none; }
</style>
</head>
<body>

<nav class="top">
  <a class="wordmark" href="index.html">fresh air</a>
</nav>

<main>
  <div class="card">

    <div id="form-state" class="form-state">
      <h1>Request a demo</h1>
      <p class="lede">Tell us who you are and we'll follow up about early access or a walkthrough.</p>

      <p class="error" id="error"></p>

      <form id="signup-form">
        <div class="row-2">
          <div class="field">
            <label for="first">First name</label>
            <input type="text" id="first" name="first" placeholder="Jordan" required autocomplete="given-name" />
          </div>
          <div class="field">
            <label for="last">Last name</label>
            <input type="text" id="last" name="last" placeholder="Rivera" required autocomplete="family-name" />
          </div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="jordan@example.com" required autocomplete="email" />
        </div>

        <div class="hp" aria-hidden="true">
          <label for="company">Company</label>
          <input type="text" id="company" name="company" tabindex="-1" autocomplete="off" />
        </div>

        <button class="submit" type="submit" id="submit-btn">Submit</button>
      </form>
      <a class="back" href="index.html">← Back</a>
    </div>

    <div id="success-state" class="success">
      <div class="check">
        <svg width="22" height="22" viewBox="0 0 20 20" fill="none"><path d="M4 10.5l3.5 3.5L16 5.5" stroke="#F5A65B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>Thanks for submitting</h1>
      <p class="lede">We've got your info and will be in touch soon.</p>
      <a class="back" href="index.html">← Back to Fresh Air</a>
    </div>

  </div>
</main>

<script>
  var SUPABASE_URL = 'https://gbbwtaxkcturxglwfiqc.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiYnd0YXhrY3R1cnhnbHdmaXFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NDU4MzYsImV4cCI6MjA5OTAyMTgzNn0.eBDgkchkk_Q1avC6ZAlrSt32H825bwYNrINRP2UJPgM';

  var form = document.getElementById('signup-form');
  var errorEl = document.getElementById('error');
  var submitBtn = document.getElementById('submit-btn');

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('show');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorEl.classList.remove('show');

    // Honeypot — a real visitor never fills this in. Bots often do; pretend
    // success without actually writing anything.
    if (document.getElementById('company').value) {
      document.getElementById('form-state').classList.add('hide');
      document.getElementById('success-state').classList.add('show');
      return;
    }

    var first = document.getElementById('first').value.trim();
    var last = document.getElementById('last').value.trim();
    var email = document.getElementById('email').value.trim();

    if (!first || !last || !email) {
      showError('Fill in all three fields.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    fetch(SUPABASE_URL + '/rest/v1/waitlist_signups', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ first_name: first, last_name: last, email: email })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('Request failed');
        document.getElementById('form-state').classList.add('hide');
        document.getElementById('success-state').classList.add('show');
      })
      .catch(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit';
        showError("Couldn't submit — check your connection and try again.");
      });
  });
</script>

</body>
</html>
